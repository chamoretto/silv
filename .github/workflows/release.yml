name: release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: tag to (re)publish, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: silv
            rustflags: "-C target-feature=+crt-static"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: silv.exe
            rustflags: "-C target-feature=+crt-static"
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: silv
            rustflags: ""
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --target ${{ matrix.target }}

      # one checksum file per target: the artifacts land in one directory, a shared
      # SHA256SUMS would be overwritten by the last download
      - name: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BIN: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          ext=""
          if [[ "$BIN" == *.exe ]]; then
            ext=".exe"
          fi
          name="silv-${TAG}-${TARGET}${ext}"
          mkdir -p dist
          cp "target/${TARGET}/release/${BIN}" "dist/${name}"
          printf '%s  %s\n' "$(sha256sum "dist/${name}" | cut -d' ' -f1)" "$name" > "dist/SHA256SUMS-${TARGET}"
          cat "dist/SHA256SUMS-${TARGET}"

      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish github release
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: bin-x86_64-unknown-linux-musl
          path: artifacts

      - uses: actions/download-artifact@v8
        with:
          name: bin-x86_64-pc-windows-msvc
          path: artifacts

      - uses: actions/download-artifact@v8
        with:
          name: bin-aarch64-apple-darwin
          path: artifacts

      - name: merge and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          cat artifacts/SHA256SUMS-* > artifacts/SHA256SUMS
          rm artifacts/SHA256SUMS-*
          sort -k2 artifacts/SHA256SUMS -o artifacts/SHA256SUMS
          (cd artifacts && sha256sum -c SHA256SUMS)
          cat artifacts/SHA256SUMS

      # `changelog` output is the file path, `content` is the text; write the file via OUTPUT
      # and hand that file to the release. `--strip all` removes the KaC header/footer: GitHub
      # already renders the release title.
      - name: generate release notes
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: release-notes.md
          GITHUB_REPO: ${{ github.repository }}

      - name: create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: artifacts/*
          body_path: release-notes.md
          generate_release_notes: false
          make_latest: true
          fail_on_unmatched_files: true
