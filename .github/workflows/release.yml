name: release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: silv
            rustflags: "-C target-feature=+crt-static"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: silv.exe
            rustflags: "-C target-feature=+crt-static"
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: silv
            rustflags: ""
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="silv-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" "dist/${name}"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            mv "dist/${name}" "dist/${name}.exe"
            printf '%s  %s\n' "$(sha256sum "dist/${name}.exe" | cut -d' ' -f1)" "${name}.exe" > "dist/SHA256SUMS"
          else
            printf '%s  %s\n' "$(sha256sum "dist/${name}" | cut -d' ' -f1)" "${name}" > "dist/SHA256SUMS"
          fi
          echo "release version: ${version}"

      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish github release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: bin-x86_64-unknown-linux-musl
          path: artifacts

      - uses: actions/download-artifact@v8
        with:
          name: bin-x86_64-pc-windows-msvc
          path: artifacts

      - uses: actions/download-artifact@v8
        with:
          name: bin-aarch64-apple-darwin
          path: artifacts

      - name: merge checksums
        run: sort artifacts/SHA256SUMS -o artifacts/SHA256SUMS

      - name: generate release notes
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip all

      - name: write release notes
        run: printf '%s\n' "${{ steps.cliff.outputs.changelog }}" > CLIFF-CHANGELOG.md
        shell: bash

      - name: create release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          body_path: CLIFF-CHANGELOG.md
          generate_release_notes: false
          make_latest: true
          fail_on_unmatched_files: true
