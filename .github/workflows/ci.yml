name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: build
        run: cargo build --all-targets

      - name: test
        run: cargo test --all-targets

      # The macOS layout probe is opt-in (src/app/keymap/macos.rs) and unverified on a headless
      # runner. Running it here means a probe problem names the probe, instead of looking like an
      # abort inside the test binary; continue-on-error keeps it informative, not a gate.
      - name: macos keymap probe (opt-in, informational)
        if: matrix.os == 'macos-latest'
        env:
          SILV_KEYMAP_PROBE: "1"
        continue-on-error: true
        run: ./target/debug/silv --key-map-show
