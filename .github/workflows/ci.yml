name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: build
        run: cargo build --all-targets

      - name: test
        if: matrix.os != 'macos-latest'
        run: cargo test --all-targets

      # The macOS layout probe calls the Carbon input source API, which only answers on the thread
      # that owns the GUI session (src/app/keymap/macos.rs). The test harness runs tests on worker
      # threads, so the probe has to be run where it is allowed: single threaded runs keep them on
      # the main thread, and the probe test exercises it. Multi-threaded runs skip that test.
      - name: test (macos, single threaded)
        if: matrix.os == 'macos-latest'
        run: cargo test --all-targets -- --test-threads=1

      # Key map resolution as the user sees it, printed by the same binary the tests built. The probe
      # of a headless runner can find no keyboard layout input source, so this step reports and does
      # not gate: a probe problem shows here, named, instead of looking like an abort in a test binary.
      - name: key map report
        if: matrix.os == 'macos-latest'
        continue-on-error: true
        run: ./target/debug/silv --key-map-show
