[package]
name = "silv"
version = "0.3.0"
edition = "2024"
rust-version = "1.88.0"
authors = ["Georgiy Chamor <chamor@felent.tech>"]
description = "Simple interactive log viewer: Kibana-like JSON Lines viewing in a terminal, TUI and grep-like modes"
license = "MIT"
keywords = ["logs", "tui", "jsonlines", "viewer", "kibana"]
repository = "https://github.com/chamoretto/silv"
documentation = "https://docs.rs/silv"
readme = "README.md"
categories = ["command-line-utilities", "development-tools::debugging"]

[lib]
name = "silv"
path = "src/lib.rs"

[[bin]]
name = "silv"
path = "src/main.rs"

[features]
# Memory profiling and benchmarking harness: counting allocator, --memory-report
# report, alternative JSON DOM comparison. Never enabled in release builds.
mem-bench = [
    "dep:bumpalo",
    "dep:cold-string",
    "dep:compact_str",
    "dep:datavalue-rs",
    "dep:hipstr",
    "dep:nanoserde",
    "dep:smallstr",
    "dep:smallvec",
    "dep:smol_str",
    "dep:smartstring",
    "dep:sonic-rs",
    "dep:thunderdome",
    "dep:tinyvec",
]

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock", "alloc"] }
clap = { version = "=4.6.7", features = ["derive", "wrap_help", "env"] }
crossterm = "=0.29.0"
# Glyph Display for op-token enums (#[display("~")]) and From for thin newtypes.
derive_more = { version = "=2.1.1", default-features = false, features = ["display", "from"] }
# Doc-comment Display for plain enums (errors keep thiserror).
displaydoc = "=0.2.7"
globset = "=0.4.21"
ijson = "=0.1.7"
memmap2 = "=0.9.12"
miette = { version = "=7.6.0", features = ["fancy"] }
ratatui = { version = "=0.30.2", default-features = false, features = [
    "crossterm",
    "layout-cache",
    "macros",
    "underline-color",
] }
rayon = "=1.12.0"
regex = "=1.13.1"
# Self-update: the github backend pulls `silv-<tag>-<target>[.exe]` release assets and
# `update()` self-replaces in place; self-replace and tempfile are its internal deps.
# ureq + rustls keep the client small and pure Rust for static linking on all platforms.
self_update = { version = "=1.3.3", default-features = false, features = ["github", "ureq", "rustls"] }
# Prerelease filtering of the release listing (the github backend does not filter them).
semver = "=1.0.28"
serde_json = { version = "=1.0.154", features = ["preserve_order", "raw_value"] }
# Variant iteration (EnumIter) and token-name Display/FromStr (Display/EnumString)
# for the enums that hand-maintain ALL/label/ORDER tables.
strum = { version = "=0.28.0", default-features = false, features = ["derive"] }
thiserror = "=2.0.21"
unicode-width = "=0.2.3"

# DOM memory comparison harness (feature mem-bench only, never in release builds).
bumpalo = { version = "=3.20.4", optional = true }
cold-string = { version = "=0.5.0", optional = true }
compact_str = { version = "=0.10.0", optional = true, default-features = false, features = ["std"] }
datavalue-rs = { version = "=0.3.3", optional = true }
hipstr = { version = "=0.8.0", optional = true, default-features = false, features = ["std"] }
nanoserde = { version = "=0.2.1", optional = true, default-features = false, features = ["std", "json"] }
smallstr = { version = "=0.3.1", optional = true, default-features = false, features = ["std"] }
smallvec = { version = "=1.16.5", optional = true, default-features = false }
smol_str = { version = "=0.3.7", optional = true, default-features = false, features = ["std"] }
smartstring = { version = "=2.0.0", optional = true, default-features = false, features = ["std"] }
sonic-rs = { version = "=0.5.11", optional = true }
thunderdome = { version = "=0.6.1", optional = true, default-features = false, features = ["std"] }
tinyvec = { version = "=1.13.3", optional = true, default-features = false, features = ["alloc"] }

[[example]]
name = "benchgen"

[[example]]
name = "memcompare"
required-features = ["mem-bench"]

[[example]]
name = "strvec_compare"
required-features = ["mem-bench"]

[[example]]
name = "arena_compare"
required-features = ["mem-bench"]

[[example]]
name = "pipeline_compare"
required-features = ["mem-bench"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
serde_json = { version = "=1.0.154", features = ["preserve_order", "raw_value"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
debug = false
incremental = false
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
