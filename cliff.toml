# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration
# Output notation: Keep a Changelog 1.1.0 (https://keepachangelog.com/en/1.1.0/)

[changelog]
# Used by `--prepend` to remove the previous header.
header_marker = "<!-- git-cliff: end of header -->"
# The Unreleased heading comes from the body template (it is a release without a version), so the
# header stops at the marker: putting it here too produced a double `## [Unreleased]`.
header = """
# Changelog\n\
\n\
All notable changes to this project will be documented in this file.\n\
\n\
The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),\n\
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n\
\n\
<!-- git-cliff: end of header -->\n\n"""
# A Tera template to be rendered for each release in the changelog.
# One line per commit (commit-based); released sections link the commit SHA,
# the Unreleased section stays plain because its SHAs are not final yet.
# See https://keats.github.io/tera/#getting-started
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
    ### {{ entry.group | striptags | trim | upper_first }}
    {% for commit in entry.commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
            {% if version %} ([{{ commit.id | truncate(length=7, end="") }}](<REPO>/commit/{{ commit.id }})){% endif %}\
    {% endfor %}
{% endfor %}

"""
# A Tera template to be rendered after the last release: version reference links.
# The Unreleased link goes to the newest tag: in a full regeneration releases[0] is the Unreleased
# section (version None) so the tag is releases[1], while `--tag v` names releases[0].
footer = """

{% if releases | length > 0 -%}
    {% if releases[0].version -%}
        [Unreleased]: <REPO>/compare/{{ releases[0].version }}...HEAD
    {% elif releases | length > 1 -%}
        [Unreleased]: <REPO>/compare/{{ releases[1].version }}...HEAD
    {% endif -%}
{% endif -%}
{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous.version -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: <REPO>/compare/{{ release.previous.version }}...{{ release.version }}
        {% else -%}
            [{{ release.version | trim_start_matches(pat="v") }}]: <REPO>/releases/tag/{{ release.version }}
        {% endif -%}
    {% endif -%}
{% endfor -%}
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true
# Render body even when there are no releases to process.
render_always = true
# An array of regex based postprocessors to modify the changelog.
postprocessors = [
    # Replace the placeholder <REPO> with the repository URL.
    { pattern = '<REPO>', replace = "https://github.com/chamoretto/silv" },
]

[git]
# Parse commits according to the conventional commits specification.
# See https://www.conventionalcommits.org
conventional_commits = true
# Exclude commits that do not match the conventional commits specification.
filter_unconventional = true
# Require all commits to be conventional.
# Takes precedence over filter_unconventional.
require_conventional = false
# Split commits on newlines, treating each line as an individual commit.
split_commits = false
# An array of regex based parsers to modify commit messages prior to further processing.
commit_preprocessors = [
    # Replace issue numbers with link templates to be updated in `changelog.postprocessors`.
    #{ pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/issues/${2}))"},
]
# Prevent commits that are breaking from being excluded by commit parsers.
protect_breaking_commits = false
# An array of regex based parsers for extracting data from the commit message.
# Group names follow Keep a Changelog section notation; parser order sets group order.
commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^[Rr]emove", group = "Removed" },
    { message = "^deprecat", group = "Deprecated" },
    { message = "^[Cc]hang(e)? ", group = "Changed" },
    { message = "^refactor", group = "Changed" },
    { body = ".*security", group = "Security" },
    { message = "^docs", group = "Documentation" },
    { message = "^test", group = "Testing" },
    { message = "^perf", group = "Performance" },
    { message = "^style", group = "Styling" },
    { message = "^revert", group = "Reverted" },
    { message = "^chore\\(release\\): prepare for", skip = true },
    { message = "^chore\\(deps.*\\)", skip = true },
    { message = "^chore\\(pr\\)", skip = true },
    { message = "^chore\\(pull\\)", skip = true },
    { message = "^chore|^ci", group = "Miscellaneous Tasks" },
    { message = ".*", group = "Other" },
]
# Exclude commits that are not matched by any commit parser.
filter_commits = false
# Fail on a commit that is not matched by any commit parser.
fail_on_unmatched_commit = false
# An array of link parsers for extracting external references, and turning them into URLs, using regex.
link_parsers = []
# Include only the tags that belong to the current branch.
use_branch_tags = false
# Order releases topologically instead of chronologically.
topo_order = false
# Order commits topologically instead of chronologically.
topo_order_commits = true
# Order of commits in each group/release within the changelog.
# Allowed values: newest, oldest
sort_commits = "oldest"
# Process submodules commits
recurse_submodules = false
